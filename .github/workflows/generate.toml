# Config for adbc-gen-workflow (adbc-drivers/dev). The driver is built by shell
# scripts (src/ci/scripts/build.sh), so the implementation language is "script".

driver = "chdb"

[lang.script.build]
lang-tools = []
# adbc-make requires a toolchain for script builds ("cpp" selects the C/C++
# manylinux image). Nothing is compiled here — build.sh downloads a prebuilt
# libchdb and repackages it — so the container is skipped.
additional-make-args = ["TOOLCHAIN=cpp", "USE_DOCKER=false"]

[lang.script.test]
# ci/scripts/test.sh checks that the packaged driver loads and answers a query.
# chDB is embedded, so there is no service to start.
service_name = ""

[lang.script.validation]
# Skipped until the validation suite lands. The driver's behaviour is covered by
# tests/test_adbc_driver.py in chdb-core, where the driver is implemented.
skip = true
# chDB is embedded; validation spins up no external service. vendor_version
# tracks the pinned chdb-core release.
configs = [
  { service_name = "", vendor_version = "26.5" },
]
